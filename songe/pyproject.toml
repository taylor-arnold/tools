[project]
name = "songe"
version = "0.1.0"
description = "Record audio and transcribe with Whisper (French)"
requires-python = ">=3.13"
dependencies = [
    "mlx-whisper",
    "numpy>=2.0.0",
    "sounddevice>=0.5.0",
]

[project.scripts]
songe = "songe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
